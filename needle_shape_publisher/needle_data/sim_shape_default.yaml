# sim_shape_default.yaml
#
# Default simulation shape for sim_level=1 (shape-driven FBG demo).
#
# Represents a planar circular arc in the x-z plane with a constant
# curvature of kappa = 0.003 rad/mm (radius R ≈ 333 mm) and a total
# arc length of 100 mm.
#
# Points are in mm, from the tissue entry point (index 0) at the origin
# to the needle tip (index -1).
#
# To use a custom shape, create a YAML (or JSON) file in the same format
# and pass its path to the sim_shape_file launch argument:
#
#   ros2 launch needle_shape_publisher sim_needle.launch.py \
#       sim_shape_file:=/path/to/your_shape.yaml

# Needle metadata assumed by this default shape
# insertion_depth: 100.0   # mm  (matches arc length)

shape:
  - [0.0000, 0.0000, 0.0000]
  - [0.6000, 0.3000, 5.0000]
  - [1.2000, 0.7000, 10.3000]
  - [1.8000, 1.0000, 15.3000]
  - [2.3000, 1.3000, 20.3000]
  - [2.7000, 1.5000, 25.2000]
  - [3.1000, 1.7000, 30.2000]
  - [3.6000, 1.9000, 35.2000]
  - [4.0000, 2.1000, 40.2000]
  - [4.4000, 2.2000, 45.2000]
  - [4.8000, 2.5000, 50.1000]
  - [5.2000, 2.7000, 55.1000]
  - [5.6000, 2.9000, 60.1000]
  - [6.0000, 3.1000, 65.1000]
  - [6.4000, 3.4000, 70.0000]
  - [6.8000, 3.6000, 75.0000]
